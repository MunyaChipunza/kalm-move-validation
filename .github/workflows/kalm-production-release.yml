name: KALM production release

on:
  push:
    branches:
      - master
    paths:
      - "assets/**"
      - "branding/**"
      - "data/**"
      - "404.html"
      - "index.html"
      - "thanks.html"
      - "merchandising.js"
      - "route-bootstrap.js"
      - "script.js"
      - "styles.css"
      - "products.json"
      - "netlify.toml"
      - "robots.txt"
      - "sitemap.xml"
      - "site.webmanifest"
      - "llms.txt"
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit SHA already merged to master. Defaults to current master.
        required: false
        type: string
      release_reason:
        description: Approved release reason / change reference.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kalm-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Protected KALM production release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      EXPECTED_NETLIFY_SITE_ID: 06334c13-7d82-45f1-b983-4a7295de88d8
      PRODUCTION_URL: https://kalmcollective.co.za
      RELEASE_APPROVAL_EVENT: ${{ github.event_name == 'workflow_dispatch' && format('workflow_dispatch:{0}', github.actor) || format('merge_to_master:{0}', github.sha) }}
      RELEASE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.release_reason || github.event.head_commit.message }}
    steps:
      - name: Resolve approved source commit
        id: source
        run: |
          source_commit="${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}"
          if [ -z "$source_commit" ]; then
            source_commit="$(git ls-remote https://github.com/MunyaChipunza/kalm-move-validation.git refs/heads/master | cut -f1)"
          fi
          test "${#source_commit}" -eq 40
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Reject incomplete or unsafe release inputs
        run: |
          source_commit="${{ steps.source.outputs.commit }}"
          test "${#source_commit}" -eq 40
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          test "$NETLIFY_SITE_ID" = "$EXPECTED_NETLIFY_SITE_ID"
          test -n "$RELEASE_APPROVAL_EVENT"

      - name: Check out the approved commit only
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0

      - name: Install pinned release dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify source is the clean current production branch head
        run: |
          test -f .kalm-approved-release-root
          git fetch origin master --depth=1
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          test "$(git rev-parse origin/master)" = "${{ steps.source.outputs.commit }}"
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/MunyaChipunza/kalm-move-validation"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('.kalm-approved-release-root','utf8'));if(s.netlifySiteId!==process.env.EXPECTED_NETLIFY_SITE_ID||s.productionDomain!==process.env.PRODUCTION_URL) process.exit(1)"

      - name: Record current production deploy
        id: previous
        run: |
          site_data="$(node -e 'process.stdout.write(JSON.stringify({site_id: process.env.NETLIFY_SITE_ID}))')"
          site="$(npx --no-install netlify api getSite --data "$site_data")"
          node -e "const s=JSON.parse(process.argv[1]);if(s.id!==process.env.EXPECTED_NETLIFY_SITE_ID||s.name!=='kalm-collective-storefront'||!s.published_deploy?.id) process.exit(1)" "$site"
          previous="$(node -e "const s=JSON.parse(process.argv[1]);console.log(s.published_deploy.id)" "$site")"
          test -n "$previous"
          echo "deploy_id=$previous" >> "$GITHUB_OUTPUT"

      - name: Build and validate rendered release candidate
        run: >-
          node tools/kalm-production-release.mjs --mode preflight --branch master
          --commit "${{ steps.source.outputs.commit }}" --previous-deploy "${{ steps.previous.outputs.deploy_id }}"
          --approval-event "$RELEASE_APPROVAL_EVENT"

      - name: Verify generated release provenance
        run: |
          test -f release/kalm-production-manifest.json
          test -f .release-output/kalm-production/.kalm-build-signature.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('.kalm-approved-release-root','utf8'));const m=JSON.parse(fs.readFileSync('release/kalm-production-manifest.json','utf8'));const p=JSON.parse(fs.readFileSync('.release-output/kalm-production/.kalm-build-signature.json','utf8'));if(m.validationStatus!=='pass'||m.buildSignature!==s.expectedBuildSignature||m.publishDirectory!==s.publishDirectory||p.repository!==s.repositoryRemote||p.sourceCommitSha!=='${{ steps.source.outputs.commit }}'||p.expectedNetlifySiteId!==s.netlifySiteId||p.productionDomain!==s.productionDomain||p.criticalAssetHash!==m.criticalAssetHash) process.exit(1)"

      - name: Deploy approved release candidate
        id: deploy
        run: npx --no-install netlify deploy --prod --dir .release-output/kalm-production --site "$NETLIFY_SITE_ID" --message "GitHub protected release ${{ steps.source.outputs.commit }}"

      - name: Validate the live custom domain
        id: smoke
        run: node tools/kalm-production-release.mjs --mode postdeploy --base-url "$PRODUCTION_URL" --commit "${{ steps.source.outputs.commit }}" --retry 12

      - name: Automatically restore previous verified deploy after failed smoke test
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          export PREVIOUS_DEPLOY_ID="${{ steps.previous.outputs.deploy_id }}"
          rollback_data="$(node -e 'process.stdout.write(JSON.stringify({site_id: process.env.NETLIFY_SITE_ID, deploy_id: process.env.PREVIOUS_DEPLOY_ID}))')"
          npx --no-install netlify api restoreSiteDeploy --data "$rollback_data"

      - name: Verify rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: node tools/kalm-production-release.mjs --mode postdeploy --base-url "$PRODUCTION_URL" --retry 12

      - name: Publish release audit record
        if: always()
        run: |
          {
            echo "## KALM production release audit"
            echo
            echo "- Approved commit: \`${{ steps.source.outputs.commit }}\`"
            echo "- Previous deploy: \`${{ steps.previous.outputs.deploy_id }}\`"
            echo "- Approval event: \`$RELEASE_APPROVAL_EVENT\`"
            echo "- Release reason: \`$RELEASE_REASON\`"
            echo "- Deploy result: \`${{ steps.deploy.outcome }}\`"
            echo "- Smoke result: \`${{ steps.smoke.outcome }}\`"
            echo "- Rollback result: \`${{ steps.rollback.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release provenance and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalm-production-release-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            release/kalm-production-manifest.json
            release/kalm-production-smoke.json
