<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KALM Collective | KS Active and KALM Move</title>
  <meta name="description" content="Shop KALM Collective across KS Active archive styles and the KALM Move concept collection. Enquiry assistance is available while payment and shipping setup is finalised.">
  <meta property="og:title" content="KALM Collective">
  <meta property="og:description" content="Curated active, home and lifestyle essentials. Shop KS Active archive styles and KALM Move.">
  <meta property="og:image" content="branding/social-preview.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="branding/favicon.png" type="image/png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="promo-strip">KS Active Archive Drop now being prepared</div>
  <header class="site-header" data-header>
    <a class="brand" href="#/" aria-label="KALM Collective home">
      <img src="branding/kalm-collective-display-logo.png" alt="KALM Collective">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span></span>
      <span></span>
      <span></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation" data-nav>
      <a href="#/shop?category=women">Women</a>
      <a href="#/shop">Activewear</a>
      <a href="#/shop?category=wellness">Wellness</a>
      <a href="#/shop?category=home-living">Home + Living</a>
      <a href="#/shop?category=outdoor-living">Outdoor Living</a>
      <a href="#/brand/ks-active">Brands</a>
      <a href="#/shop?category=sale">Sale</a>
    </nav>
    <button class="cart-button" type="button" data-cart-open aria-label="Open enquiry bag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5h11l-1 9h-9l-1-9Z"/><path d="M8.5 7.5a3.5 3.5 0 0 1 7 0"/><path d="M9 20h.01M15 20h.01"/></svg>
      <span>Enquiry</span>
      <strong data-cart-count>0</strong>
    </button>
  </header>

  <main id="app" tabindex="-1">
    <section class="loading-state" aria-live="polite">
      <p class="micro">KALM Collective</p>
      <h1>Loading the shop.</h1>
    </section>
  </main>

  <aside class="cart-drawer" data-cart-drawer aria-hidden="true" aria-label="Enquiry bag">
    <div class="cart-panel">
      <div class="cart-head">
        <div>
          <p class="micro">Your enquiry</p>
          <h2>Request summary</h2>
        </div>
        <button class="icon-button" type="button" data-cart-close aria-label="Close cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-summary">
        <div><span>Subtotal</span><strong data-cart-subtotal>R0</strong></div>
        <p>No payment is taken here. KALM confirms availability, payment and delivery details directly.</p>
        <a class="button primary full" href="#/checkout" data-cart-checkout>Send enquiry</a>
      </div>
    </div>
  </aside>

  <form name="kalm-collective-order-assistance" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html" hidden>
    <input type="hidden" name="form-name" value="kalm-collective-order-assistance">
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <input name="whatsapp">
    <input name="cart_summary">
    <input name="delivery_area">
    <textarea name="message"></textarea>
    <input name="popia_consent">
  </form>

  <form name="kalm-collective-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html" hidden>
    <input type="hidden" name="form-name" value="kalm-collective-contact">
    <input name="bot-field">
    <input name="name">
    <input name="email">
    <input name="whatsapp">
    <select name="topic"><option>Order assistance</option></select>
    <textarea name="message"></textarea>
    <input name="popia_consent">
  </form>

  <script src="script.js" defer></script>
</body>
</html>
