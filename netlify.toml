[build]
  publish = "."

# Review and source-lock material is never a public storefront asset. The
# underlying audit history remains in Git, while these request paths are
# explicitly unavailable from every production or preview deployment.
[[redirects]]
  from = "/assets/images/review-only/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/reports/KS-ACTIVE-ARCHIVE/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/review/ks-active/*"
  to = "/404.html"
  status = 404
  force = true

# ksactive.co.za is a domain alias, never a second storefront. These rules are
# deliberately host-specific and precede the SPA rewrites below.
[[redirects]]
  from = "http://ksactive.co.za/*"
  to = "https://kalmcollective.co.za/#/brand/ks-active"
  status = 301
  force = true

[[redirects]]
  from = "https://ksactive.co.za/*"
  to = "https://kalmcollective.co.za/#/brand/ks-active"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ksactive.co.za/*"
  to = "https://kalmcollective.co.za/#/brand/ks-active"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ksactive.co.za/*"
  to = "https://kalmcollective.co.za/#/brand/ks-active"
  status = 301
  force = true

[[redirects]]
  from = "/products/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/collections/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/brands"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/brand/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/policies"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
